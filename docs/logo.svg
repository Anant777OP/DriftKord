<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1433"/>
      <stop offset="1" stop-color="#0b0b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="150" fill="url(#bg)"/>
  <ellipse cx="512" cy="512" rx="420" ry="260" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- back wave (teal) -->
    <path d="M150 512 C 290 452, 420 432, 512 492 S 760 600, 874 512" stroke="#0aa0b8" stroke-opacity="0.85" stroke-width="30"/>
    <!-- middle wave (magenta) -->
    <path d="M150 512 C 300 432, 380 380, 460 410 S 620 590, 720 590 S 840 545, 874 512" stroke="#e0379f" stroke-opacity="0.9" stroke-width="40"/>
    <!-- front wave (cyan) -->
    <path d="M150 512 C 250 560, 330 540, 400 450 S 520 300, 600 370 S 700 580, 770 570 S 850 535, 874 512" stroke="#00e5ff" stroke-width="54"/>
  </g>
</svg>

